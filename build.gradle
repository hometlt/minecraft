plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

// Keep private review builds and their run directory outside the source checkout when requested.
if (providers.gradleProperty('starmineBuildRoot').isPresent()) {
	layout.buildDirectory = file(providers.gradleProperty('starmineBuildRoot').get())
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	// Sodium (optional, compile-only): the command view's fog of blocks hooks its chunk mesher too
	exclusiveContent {
		forRepository { maven { url = "https://api.modrinth.com/maven" } }
		filter { includeGroup "maven.modrinth" }
	}
}

loom {
	splitEnvironmentSourceSets()

	// In-game tests (src/main/java/dev/starmine/entity/DroneGameTests.java): gradlew runGametest
	runs {
		client {
			if (providers.gradleProperty('starmineRunDir').isPresent()) {
				runDir providers.gradleProperty('starmineRunDir').get()
			}
			// extra game arguments, e.g. -PstarmineClientArgs="--quickPlaySingleplayer~World", parted by ~, to open a world at once (profiling)
			if (providers.gradleProperty('starmineClientArgs').isPresent()) {
				programArgs(*providers.gradleProperty('starmineClientArgs').get().tokenize('~'))
			}
		}
		// scenario harness in a real client (dev.starmine.client.Harness): gradlew runHarness [-PstarmineHarness=hitbox]
		harness {
			inherit client
			name "Harness"
			vmArg "-Dstarmine.harness=${providers.gradleProperty('starmineHarness').getOrElse('all')}"
			runDir "${project.layout.buildDirectory.get()}/harness/run"
		}
		gametest {
			inherit server
			name "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest/junit.xml"
			runDir "${project.layout.buildDirectory.get()}/gametest/run"
		}
	}

	mods {
		"starmine" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

configurations {
	patchouliArtifact
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Sodium is not needed to run StarMine: with it installed (and Iris, which draws terrain through it, with
	// shader packs) the fog of blocks hooks Sodium's mesher (dev.starmine.mixin.sodium); compiled against it only
	modCompileOnly "maven.modrinth:sodium:${project.sodium_version}"

	// Patchouli is optional (owner 16.10: the illustrated field guide). StarMine's book is data only
	// (data/starmine/patchouli_books, assets/starmine/patchouli_books); without Patchouli the written book is given.
	// In dev runs (runClient, runGametest) it is present so the book can be opened and tested.
	modLocalRuntime "maven.modrinth:patchouli:${project.patchouli_version}"
	// its library fiber is nested in Patchouli's jar and published nowhere else; the dev runtime does not unpack it
	patchouliArtifact("maven.modrinth:patchouli:${project.patchouli_version}") { transitive = false }
	localRuntime files({ zipTree(configurations.patchouliArtifact.singleFile).matching { include 'META-INF/jars/*.jar' }.files })
}

def gameTestSelection = providers.gradleProperty('starmineGameTests').getOrElse('all')
// all, structures, heavy, light, or a comma-separated list of game test classes (dev.starmine.entity.VespeneGameTests,...).
// heavy: the long, world-loading classes (paths, balance fights, structures, far bases, other worlds); light: all the
// others. Run apart (light, then heavy) they do not slow each other down: tools/run_gametests.sh does both.
def heavyGameTests = ['PathfindingGameTests', 'BalanceGameTests', 'StructureGameTests', 'DroneGameTests', 'FarBaseGameTests',
	'StratosphereGameTests', 'DimensionHeroGameTests', 'BaseDefenceGameTests']
def allGameTests = { ->
	def list = (file('src/main/resources/fabric.mod.json').text =~ /"fabric-gametest":\s*\[([^\]]*)\]/)[0][1]
	(list =~ /"([^"]+)"/).collect { it[1] }
}
def gameTestClasses = gameTestSelection == 'structures' ? ['dev.starmine.world.StructureGameTests']
	: gameTestSelection == 'heavy' ? allGameTests().findAll { name -> heavyGameTests.any { name.endsWith('.' + it) } }
	: gameTestSelection == 'light' ? allGameTests().findAll { name -> !heavyGameTests.any { name.endsWith('.' + it) } }
	: gameTestSelection == 'all' ? [] : gameTestSelection.split(',').collect { it.trim() }
if (!gameTestClasses.every { it ==~ /dev\.starmine\.[a-z.]+\.[A-Z][A-Za-z]*GameTests/ })
	throw new GradleException('starmineGameTests must be all, structures, heavy, light or game test classes')
processResources {
	def version = project.version
	inputs.property "version", version
	inputs.property 'starmineGameTests', gameTestSelection

	filesMatching("fabric.mod.json") {
		expand "version": version
		if (!gameTestClasses.isEmpty()) filter { String line ->
			line.contains('"fabric-gametest":') ? '\t\t"fabric-gametest": [' + gameTestClasses.collect { '"' + it + '"' }.join(', ') + ']' : line
		}
	}
}

// SC2-derived assets (models, textures, sounds) are produced by Modkit from the user's own StarCraft II
// installation into sc2-assets/ (git-ignored). Dev runs see them; a published jar never carries them
// unless built explicitly with -PincludeSc2Assets for a private local install.
// Modkit owns conversion; Gradle selects one complete prepared tree, never overlays both modes.
def modelMode = providers.gradleProperty('starmineModelMode').getOrElse('original')
if (!(modelMode in ['original', 'voxel'])) throw new GradleException('starmineModelMode must be original or voxel')
def assetsRoot = file(providers.gradleProperty('starmineAssetsDir').getOrElse('sc2-assets'))
def modelMarker = new File(assetsRoot, 'assets/starmine/models/sc2/model-package.json')
if (modelMode == 'voxel') {
	if (!providers.gradleProperty('starmineAssetsDir').isPresent() || !modelMarker.isFile()) {
		throw new GradleException('voxel mode requires starmineAssetsDir with a completed Modkit model-package.json')
	}
	def prepared = new groovy.json.JsonSlurper().parse(modelMarker)
	if (prepared.schemaVersion != 1 || prepared.modelMode != 'voxel' ||
		prepared.selectedOriginalDeathModels != 'excluded' || prepared.lossesAreExplicit != true ||
		!(prepared.selectedModels instanceof List) || prepared.selectedModels.isEmpty() ||
		prepared.selectedModels.unique(false).size() != prepared.selectedModels.size()) {
		throw new GradleException('Invalid or incomplete voxel package marker')
	}
	def packagedModels = new File(assetsRoot, 'assets/starmine/models/sc2').listFiles()
		.findAll { it.name.endsWith('.smm') && !it.name.endsWith('_death.smm') }
		.collect { it.name.substring(0, it.name.length() - 4) }
	if (!prepared.selectedModels.containsAll(packagedModels)) {
		throw new GradleException('Partial voxel package refused: every packaged model must be converted, not an original fallback')
	}
	// Every model of the mod's export list (docs/sc2-models.json) is converted or named as unavailable with its
	// reason (no model in the game's data): a model left out without a word is a partial package.
	def unavailable = prepared.unavailableModels ?: [:]
	if (!(unavailable instanceof Map) || unavailable.any { name, reason -> !(reason instanceof String) || reason.isBlank() || name in prepared.selectedModels }) {
		throw new GradleException('Invalid unavailableModels in the voxel package marker')
	}
	def listed = new groovy.json.JsonSlurper().parse(file('docs/sc2-models.json')).models.collect { it.model }
	def uncovered = listed.findAll { !(it in prepared.selectedModels) && !unavailable.containsKey(it) }
	if (!uncovered.isEmpty()) {
		throw new GradleException("Partial voxel package refused: models of docs/sc2-models.json neither converted nor listed unavailable: ${uncovered}")
	}
	prepared.selectedModels.each { kind ->
		if (!(kind instanceof String) || !(kind ==~ /[a-z0-9_]+/) ||
			!new File(assetsRoot, "assets/starmine/models/sc2/${kind}.smm").isFile() ||
			!new File(assetsRoot, "assets/starmine/textures/entity/sc2/${kind}_voxel.png").isFile() ||
			new File(assetsRoot, "assets/starmine/models/sc2/${kind}_death.smm").exists()) {
			throw new GradleException("Missing voxel model/atlas or stale original death model: ${kind}")
		}
	}
	logger.lifecycle("StarMine voxel mode: ${prepared.selectedModels.size()} models converted, ${unavailable.size()} unavailable in the game: ${unavailable.keySet()}")
} else if (modelMarker.isFile()) {
	throw new GradleException('original mode must not use a voxel package; select the original assets directory')
}
sourceSets.client.resources.srcDir assetsRoot
// Loom captures the standard resource path. Rebuild only that generated output when inputs change;
// an overlay copy could otherwise retain an original death model removed by the voxel package.
def expectedClientResources = layout.buildDirectory.dir('resources/client').get().asFile.canonicalPath
tasks.named('processClientResources') {
	inputs.property('starmineModelMode', modelMode)
	doFirst {
		if (destinationDir.canonicalPath != expectedClientResources) {
			throw new GradleException('Refusing to clear a nonstandard resource destination')
		}
		if (destinationDir.exists() && !destinationDir.deleteDir()) {
			throw new GradleException('Could not clear generated client resources')
		}
	}
}
tasks.named('jar') {
	if (!project.hasProperty('includeSc2Assets')) exclude 'assets/starmine/**/sc2/**', 'assets/starmine/sounds.json'
	else archiveClassifier = "${modelMode}-dev"
}
tasks.named('remapJar') {
	if (project.hasProperty('includeSc2Assets')) archiveClassifier = modelMode
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.named('sourcesJar') { exclude 'assets/starmine/**/sc2/**', 'assets/starmine/sounds.json' }

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
